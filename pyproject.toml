[project]
name = "inkecho"
version = "0.12.3"
description = "A privacy-conscious Linux voice input application"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "dbus-next>=0.2.3,<1",
    "httpx>=0.28,<1",
    "qasync>=0.27,<1",
    "websockets>=15,<16",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# Historical experiment probes and fixtures are immutable verification evidence.
# Maintained application code, tests and validation tools belong outside this archive.
extend-exclude = ["experiments"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts/validation"]
